[project]
name = "1049-deloitte-project"
version = "0.1.0"
description = "Consulting workplan agent: brief → WBS + RAID with revision loop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "typer>=0.12",
    "jinja2>=3.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
workplan = "workplan_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workplan_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
